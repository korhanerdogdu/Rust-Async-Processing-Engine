// Rust Async Processing Engine – protobuf contract.
//
// Two services share the same messages:
//   * JobGateway   – PUBLIC gRPC API served by api-gateway (port 50051).
//   * WorkerEngine – INTERNAL IPC API served by worker-engine (port 50052,
//                    127.0.0.1 / private network only). Only the gateway calls it.
//
// Job parameters travel as `payload_json` (a JSON object as text) so that REST
// and gRPC feed exactly the same validation code (engine_core::JobCommand::parse).
//
// Errors are standard gRPC status codes; the stable engine error code is in the
// `x-engine-error-code` response metadata (see crates/ipc/src/status.rs).

syntax = "proto3";

package engine.v1;

import "google/protobuf/timestamp.proto";

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_PROCESSING = 2;
  JOB_STATUS_COMPLETED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
}

message Job {
  string job_id = 1;
  string job_type = 2;
  JobStatus status = 3;
  int64 status_version = 4;
  uint32 attempts = 5;
  uint32 max_attempts = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp queued_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  google.protobuf.Timestamp next_attempt_at = 11;
  optional string error_code = 12;
  optional string error_message = 13;
  optional string trace_id = 14;
}

message Artifact {
  string file_name = 1;
  string content_type = 2;
  uint64 size_bytes = 3;
  string sha256 = 4;
}

message SubmitJobRequest {
  string job_type = 1;
  string payload_json = 2;
  optional string idempotency_key = 3;
}

message SubmitJobResponse {
  Job job = 1;
  bool deduplicated = 2;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResultRequest {
  string job_id = 1;
}

message JobResult {
  Job job = 1;
  string result_json = 2;
  optional Artifact artifact = 3;
}

message ListJobsRequest {
  optional JobStatus status = 1;
  uint32 limit = 2;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

message GetJobHistoryRequest {
  string job_id = 1;
}

message HistoryEntry {
  JobStatus from_status = 1;
  JobStatus to_status = 2;
  int64 status_version = 3;
  uint32 attempt = 4;
  optional string reason = 5;
  optional string actor = 6;
  optional string error_code = 7;
  google.protobuf.Timestamp at = 8;
}

message GetJobHistoryResponse {
  repeated HistoryEntry entries = 1;
}

message DownloadArtifactRequest {
  string job_id = 1;
}

// First message carries `info`, the following ones carry `data`.
message ArtifactChunk {
  oneof kind {
    Artifact info = 1;
    bytes data = 2;
  }
}

message StatusEvent {
  string job_id = 1;
  JobStatus status = 2;
  int64 status_version = 3;
  uint32 attempts = 4;
  optional string error_code = 5;
  google.protobuf.Timestamp at = 6;
}

message SubscribeStatusRequest {}

// The subscriber fell behind (broadcast lag) or just (re)connected: events may
// have been missed and current state must be re-read (snapshot) – events are
// hints, PostgreSQL is the truth.
message Resync {
  uint64 missed = 1;
}

message StatusStreamMessage {
  oneof kind {
    StatusEvent event = 1;
    Resync resync = 2;
  }
}

message WatchJobRequest {
  string job_id = 1;
}

message WatchJobMessage {
  oneof kind {
    Job snapshot = 1;
    StatusEvent event = 2;
  }
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string state = 2;
  bool database_ok = 3;
  string detail = 4;
}

message EngineStatsRequest {}

message StatusCount {
  JobStatus status = 1;
  int64 count = 2;
}

message EngineStats {
  string worker_id = 1;
  string state = 2;
  uint32 queue_capacity = 3;
  uint32 queue_depth = 4;
  uint32 max_active_jobs = 5;
  uint32 active_jobs = 6;
  repeated string running_job_ids = 7;
  uint32 rayon_threads = 8;
  uint32 tokio_worker_threads = 9;
  uint64 tokio_alive_tasks = 10;
  repeated StatusCount jobs_by_status = 11;
  uint64 log_records_dropped = 12;
  uint64 log_records_written = 13;
  uint32 status_subscribers = 14;
  string metrics_prometheus = 15;
  uint32 available_parallelism = 16;
}

service WorkerEngine {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc GetJobResult(GetJobResultRequest) returns (JobResult);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc GetJobHistory(GetJobHistoryRequest) returns (GetJobHistoryResponse);
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream ArtifactChunk);
  // One long-lived stream per gateway: all committed status transitions.
  rpc SubscribeStatus(SubscribeStatusRequest) returns (stream StatusStreamMessage);
  rpc GetEngineStats(EngineStatsRequest) returns (EngineStats);
  rpc Health(HealthRequest) returns (HealthResponse);
}

service JobGateway {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc GetJobResult(GetJobResultRequest) returns (JobResult);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream ArtifactChunk);
  // Snapshot first, then live transitions until a terminal state.
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobMessage);
}
